name: Supabase keepalive

# Ücretsiz plan inaktif projeleri duraklatır; haftalık ping bunu önler.
on:
  schedule:
    - cron: "0 6 * * 1,4" # pazartesi ve perşembe 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "ok"
