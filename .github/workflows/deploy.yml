name: Build & Deploy to Hostinger

# main dalına her push'ta çalışır
on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub arayüzünden elle de tetiklenebilir

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Build çıktısının bulunduğu klasör
          local-dir: ./out/
          # Hostinger'da domain'in dosyalarının olduğu klasör.
          # Ana domain ise genelde: ./public_html/
          # Addon/ek domain ise: ./domains/omersenem.com/public_html/
          server-dir: ./public_html/
